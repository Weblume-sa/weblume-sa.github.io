<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Weblume | الأدمن</title>
<link rel="icon" href="../assets/weblume-icon.png">
<link rel="apple-touch-icon" href="../assets/weblume-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--panel:#0b0b0b;--card:#141414;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--txt:#f7f5f2;--mut:#8d8a86;--red:#d4182a;--red-hi:#ef2336;--green:#3ddc84}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .logo{font-family:'Poppins',sans-serif;font-weight:700;direction:ltr;letter-spacing:-.4px}
  .logo span{color:var(--red)}
  .hide{display:none!important}

  /* login */
  .login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 22px}
  .login .logo{font-size:30px;text-align:center}
  .login p{color:var(--mut);text-align:center;font-size:14px;margin-bottom:6px}
  .in{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:13px 14px;font-size:15px;outline:none}
  .in:focus{border-color:var(--red)}
  .btn{height:48px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:600;font-size:15px}
  .btn:hover{background:var(--red-hi)}
  .btn:disabled{opacity:.6}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#111}
  .gbtn:hover{background:#eee}
  .gbtn svg{width:22px;height:22px}
  .uid{font-size:13px;color:var(--mut);text-align:center;line-height:1.8}
  .uid code{display:block;margin-top:6px;padding:10px;border-radius:10px;background:var(--card);color:var(--txt);direction:ltr;user-select:all;word-break:break-all;font-size:13px}
  .err{color:#ff8a94;font-size:13px;text-align:center;min-height:18px}

  /* app */
  .app{height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel)}
  .top .logo{font-size:20px;margin-inline-end:auto}
  .pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13.5px}
  .pill .d{width:9px;height:9px;border-radius:50%;background:#666}
  .pill.on{border-color:rgba(61,220,132,.5)}
  .pill.on .d{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,132,.2)}
  .icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center}
  .icon svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .main{flex:1;display:flex;min-height:0}
  .list{width:340px;border-inline-end:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  .row{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 16px}
  .row:hover,.row.act{background:#151515}
  .av{width:44px;height:44px;border-radius:50%;background:#222;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
  .row .meta{flex:1;min-width:0}
  .row .l1{display:flex;align-items:center;gap:8px}
  .row .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .row .tm{font-size:12px;color:var(--mut);flex:none}
  .row .l2{display:flex;align-items:center;gap:8px;margin-top:2px}
  .row .lm{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .row.unread .lm{color:var(--txt)}
  .badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .empty{padding:40px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.8}

  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .chd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .chd .nm{font-weight:600;font-size:16px}
  .chd small{display:block;color:var(--mut);font-size:12px}
  .back{display:none}
  .msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
  .m.v{align-self:flex-start;background:#1c1c1c;border:1px solid var(--line);border-start-start-radius:5px}
  .m.a{align-self:flex-end;background:var(--red);color:#fff;border-start-end-radius:5px}
  .m .t{display:block;font-size:11px;opacity:.6;margin-top:3px}
  .day{align-self:center;font-size:12px;color:var(--mut);margin:8px 0}
  .cmp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
  .cmp textarea{flex:1;resize:none;min-height:48px;max-height:140px;line-height:1.5}
  .snd{width:48px;height:48px;border-radius:50%;border:0;background:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
  .snd svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
  .placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px;padding:24px;text-align:center}

  @media (max-width:760px){
    .list{width:100%;border:0}
    .main.in-chat .list{display:none}
    .main:not(.in-chat) .chat{display:none}
    .back{display:flex}
  }
</style>
</head>
<body>

<section class="login" id="loginView">
  <form id="loginForm" novalidate>
    <div class="logo">Web<span>lume</span></div>
    <p>لوحة الأدمن · الشات</p>
    <button class="btn gbtn" id="loginBtn" type="submit"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>دخول بحساب جوجل</button>
    <div class="err" id="loginErr"></div>
    <div class="uid hide" id="uidBox">ابعت الكود ده لـ Claude عشان يخلّيك أدمن:<code id="uidTxt"></code></div>
  </form>
</section>

<section class="app hide" id="appView">
  <header class="top">
    <div class="logo">Web<span>lume</span></div>
    <button class="pill" id="onlineBtn" type="button"><span class="d"></span><span id="onlineTxt">أوفلاين</span></button>
    <button class="icon" id="notifBtn" type="button" title="تفعيل الإشعارات" aria-label="تفعيل الإشعارات"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
    <button class="icon" id="logoutBtn" type="button" title="خروج" aria-label="خروج"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg></button>
  </header>
  <div class="main" id="main">
    <aside class="list" id="list"><div class="empty">مفيش محادثات لسه.<br>أول ما حد يكلمك من الموقع هيظهر هنا.</div></aside>
    <div class="chat">
      <div class="placeholder" id="placeholder">اختار محادثة من القايمة</div>
      <div class="chd hide" id="chatHead">
        <button class="icon back" id="backBtn" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <div class="av" id="chatAv"></div>
        <div><div class="nm" id="chatName"></div><small id="chatSub"></small></div>
      </div>
      <div class="msgs hide" id="msgs"></div>
      <form class="cmp hide" id="cmp" novalidate>
        <textarea class="in" id="reply" rows="1" maxlength="1500" placeholder="اكتب ردك…"></textarea>
        <button class="snd" type="submit" aria-label="إرسال"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </form>
    </div>
  </div>
</section>

<script type="module">
import { firebaseConfig, ADMIN_UID, FIREBASE_SDK, isConfigured } from '../assets/firebase-config.js';

const $ = id => document.getElementById(id);
if (!isConfigured()) {
  $('loginErr').textContent = 'إعدادات Firebase لسه متحطتش في firebase-config.js';
  $('loginBtn').disabled = true;
  throw new Error('Firebase not configured');
}

const [{ initializeApp }, A, F] = await Promise.all([
  import(`${FIREBASE_SDK}/firebase-app.js`),
  import(`${FIREBASE_SDK}/firebase-auth.js`),
  import(`${FIREBASE_SDK}/firebase-firestore.js`)
]);
const app = initializeApp(firebaseConfig);
const auth = A.getAuth(app);
const db = F.getFirestore(app);
const statusRef = F.doc(db, 'meta', 'status');

let unsubChats = null, unsubMsgs = null, chats = [], activeId = null, firstLoad = true;
let isOnline = false, beatTimer = null;
const baseTitle = document.title;

/* ---------- auth ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  const provider = new A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await A.signInWithPopup(auth, provider);
  } catch (err) {
    if (err && /popup-blocked|operation-not-supported/.test(err.code || '')) {
      await A.signInWithRedirect(auth, provider);
    } else if (!/popup-closed|cancelled-popup/.test((err && err.code) || '')) {
      $('loginErr').textContent = 'الدخول فشل، جرّب تاني';
      console.error(err);
    }
  }
  $('loginBtn').disabled = false;
});
$('logoutBtn').addEventListener('click', async () => { await setOnline(false); A.signOut(auth); });

A.getRedirectResult(auth).catch(() => {});
A.onAuthStateChanged(auth, user => {
  const ok = Boolean(user && !user.isAnonymous && ADMIN_UID && user.uid === ADMIN_UID);
  if (user && !user.isAnonymous && !ok) {
    $('loginErr').textContent = 'الحساب ده مش أدمن';
    $('uidTxt').textContent = user.uid;
    $('uidBox').classList.remove('hide');
  }
  $('loginView').classList.toggle('hide', !!ok);
  $('appView').classList.toggle('hide', !ok);
  if (ok) start(); else stop();
});

/* ---------- helpers ---------- */
const initial = n => (n || '؟').trim().charAt(0).toUpperCase();
function when(ts) {
  if (!ts || !ts.toDate) return '';
  const d = ts.toDate(), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
}

/* ---------- notifications ---------- */
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
}
function notify(name, text) {
  beep();
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try { new Notification('رسالة جديدة من ' + (name || 'زائر'), { body: text || '', icon: '../assets/weblume-icon.png' }); } catch (e) {}
  }
}
$('notifBtn').addEventListener('click', async () => {
  beep();
  if ('Notification' in window) {
    const p = await Notification.requestPermission();
    $('notifBtn').style.borderColor = p === 'granted' ? 'rgba(61,220,132,.6)' : '';
  }
});

/* ---------- online status ---------- */
async function setOnline(on) {
  isOnline = on;
  $('onlineBtn').classList.toggle('on', on);
  $('onlineTxt').textContent = on ? 'أونلاين' : 'أوفلاين';
  clearInterval(beatTimer);
  try { await F.setDoc(statusRef, { online: on, at: F.serverTimestamp() }); } catch (e) {}
  if (on) beatTimer = setInterval(() => F.setDoc(statusRef, { online: true, at: F.serverTimestamp() }).catch(() => {}), 60000);
}
$('onlineBtn').addEventListener('click', () => setOnline(!isOnline));
addEventListener('pagehide', () => { if (isOnline) F.setDoc(statusRef, { online: false, at: F.serverTimestamp() }).catch(() => {}); });

/* ---------- chat list ---------- */
function start() {
  if (unsubChats) return;
  setOnline(true);
  unsubChats = F.onSnapshot(F.query(F.collection(db, 'chats'), F.orderBy('updatedAt', 'desc'), F.limit(200)), snap => {
    if (!firstLoad) {
      snap.docChanges().forEach(ch => {
        const d = ch.doc.data();
        if (ch.type !== 'removed' && d.lastFrom === 'visitor' && d.unreadAdmin > 0 && (ch.doc.id !== activeId || document.hidden)) notify(d.name, d.lastMessage);
      });
    }
    firstLoad = false;
    chats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList();
  }, err => { $('list').innerHTML = '<div class="empty">مش قادر أقرا المحادثات. اتأكد من قواعد Firestore.</div>'; console.error(err); });
}
function stop() {
  if (unsubChats) { unsubChats(); unsubChats = null; }
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  clearInterval(beatTimer);
  firstLoad = true; activeId = null;
}

function renderList() {
  const list = $('list');
  const total = chats.reduce((s, c) => s + (c.unreadAdmin || 0), 0);
  document.title = total ? `(${total}) ${baseTitle}` : baseTitle;
  if (!chats.length) { list.innerHTML = '<div class="empty">مفيش محادثات لسه.<br>أول ما حد يكلمك من الموقع هيظهر هنا.</div>'; return; }
  list.textContent = '';
  chats.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'row' + (c.id === activeId ? ' act' : '') + (c.unreadAdmin ? ' unread' : '');
    b.innerHTML = `<div class="av"></div><div class="meta"><div class="l1"><span class="nm"></span><span class="tm"></span></div><div class="l2"><span class="lm"></span></div></div>`;
    b.querySelector('.av').textContent = initial(c.name);
    b.querySelector('.nm').textContent = c.name || 'زائر';
    b.querySelector('.tm').textContent = when(c.updatedAt);
    b.querySelector('.lm').textContent = (c.lastFrom === 'admin' ? 'إنت: ' : '') + (c.lastMessage || '…');
    if (c.unreadAdmin) {
      const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = c.unreadAdmin;
      b.querySelector('.l2').appendChild(bd);
    }
    b.addEventListener('click', () => openChat(c.id));
    list.appendChild(b);
  });
  if (activeId) {
    const c = chats.find(x => x.id === activeId);
    if (c) { $('chatName').textContent = c.name || 'زائر'; $('chatAv').textContent = initial(c.name); }
  }
}

/* ---------- conversation ---------- */
function openChat(id) {
  activeId = id;
  const c = chats.find(x => x.id === id) || {};
  ['chatHead', 'msgs', 'cmp'].forEach(x => $(x).classList.remove('hide'));
  $('placeholder').classList.add('hide');
  $('main').classList.add('in-chat');
  $('chatName').textContent = c.name || 'زائر';
  $('chatAv').textContent = initial(c.name);
  $('chatSub').textContent = c.createdAt ? 'من ' + when(c.createdAt) : '';
  renderList();
  if (unsubMsgs) unsubMsgs();
  const ref = F.doc(db, 'chats', id);
  unsubMsgs = F.onSnapshot(F.query(F.collection(ref, 'messages'), F.orderBy('at', 'asc')), snap => {
    renderMsgs(snap.docs.map(d => d.data()));
    if (!document.hidden) F.updateDoc(ref, { unreadAdmin: 0 }).catch(() => {});
  });
  setTimeout(() => $('reply').focus({ preventScroll: true }), 50);
}
function renderMsgs(ms) {
  const box = $('msgs');
  box.textContent = '';
  let day = '';
  ms.forEach(m => {
    const d = m.at && m.at.toDate ? m.at.toDate() : new Date();
    if (d.toDateString() !== day) {
      day = d.toDateString();
      const s = document.createElement('div'); s.className = 'day';
      s.textContent = d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
      box.appendChild(s);
    }
    const el = document.createElement('div');
    el.className = 'm ' + (m.from === 'admin' ? 'a' : 'v');
    el.textContent = m.text;
    const t = document.createElement('span'); t.className = 't';
    t.textContent = d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
    el.appendChild(t);
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
}
$('backBtn').addEventListener('click', () => {
  $('main').classList.remove('in-chat');
  activeId = null;
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  renderList();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && activeId) F.updateDoc(F.doc(db, 'chats', activeId), { unreadAdmin: 0 }).catch(() => {});
});

$('cmp').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('reply').value.trim();
  if (!text || !activeId) return;
  $('reply').value = ''; $('reply').style.height = '';
  const ref = F.doc(db, 'chats', activeId);
  try {
    await F.addDoc(F.collection(ref, 'messages'), { from: 'admin', text, at: F.serverTimestamp() });
    await F.updateDoc(ref, { updatedAt: F.serverTimestamp(), lastMessage: text.slice(0, 140), lastFrom: 'admin', unreadAdmin: 0 });
  } catch (err) {
    $('reply').value = text;
    alert('الرد متبعتش، جرّب تاني');
  }
});
$('reply').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover:hover)').matches) { e.preventDefault(); $('cmp').requestSubmit(); }
});
$('reply').addEventListener('input', () => { const r = $('reply'); r.style.height = 'auto'; r.style.height = Math.min(r.scrollHeight, 140) + 'px'; });
</script>
</body>
</html>
