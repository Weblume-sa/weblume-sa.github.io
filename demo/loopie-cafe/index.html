<!doctype html>

<meta charset="utf-8">

<style>
  :root{
    --ink:#141210;--white:#fff;--yellow:#EBB81F;--muted:#B9B1A7;
    --gut:clamp(16px,3.4vw,56px);--bar:56px;--nav:60px;
    --small:14px;--body:clamp(16px,1.2vw,18px);--lead:clamp(22px,2.3vw,34px);
    --head:clamp(46px,6.8vw,112px);--giant:clamp(76px,15vw,240px);
    --display:'Alexandria','IBM Plex Sans Arabic',sans-serif;
  }
  @media (min-width:860px){:root{--bar:0px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:var(--nav)}
  body{background:var(--ink);color:var(--white);font:400 var(--body)/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:var(--bar);overflow-x:clip}
  a{color:inherit;text-decoration:none}
  img,video{display:block;width:100%;height:100%;object-fit:cover}
  ul{list-style:none}
  h1,h2,h3,.word,.temp,.cap,.big,.addr{font-family:var(--display);font-weight:800}
  h1,h2{font-size:var(--head);line-height:1.12}
  html[dir=ltr] h1,html[dir=ltr] h2,html[dir=ltr] .word,html[dir=ltr] .cap{letter-spacing:-.035em}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  /* the page's one shape: the loop in the logo */
  .disc{border-radius:50%;overflow:hidden}
  .loop{border-radius:999px;overflow:hidden}

  .ribbon{position:relative;z-index:30;background:var(--yellow);color:var(--ink);font-size:var(--small);line-height:1.4;text-align:center;padding:3px 16px}
  .ribbon a{text-decoration:underline}

  .nav{position:sticky;top:0;z-index:20;height:var(--nav);display:flex;align-items:center;justify-content:space-between;gap:24px;padding-inline:var(--gut);background:var(--ink);color:var(--white)}
  .brand{display:flex;align-items:center;gap:10px;font:800 18px/1 var(--display)}
  .brand svg{width:40px;height:22px;flex:none}
  .nav ul{display:none;gap:32px;font-weight:500}
  .nav ul a,.nav .wa,footer a{transition:color .2s}
  .nav ul a:hover,.nav .wa:hover,footer a:hover{color:var(--yellow)}
  .nav .end{display:flex;align-items:center;gap:20px}
  .nav .wa{font-weight:700}
  .nav button{background:none;border:0;color:inherit;font:700 var(--body) 'IBM Plex Sans Arabic',sans-serif;cursor:pointer;padding:6px 0;transition:color .2s}
  .nav button:hover{color:var(--yellow)}
  @media (min-width:860px){.nav ul{display:flex}.nav #mopen{display:none}}
  @media (max-width:859px){.nav .wa{display:none}}
  .mnav{position:fixed;inset:0;z-index:40;background:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:72px var(--gut) 40px}
  .mnav[hidden]{display:none}
  .mnav a{font:800 clamp(42px,12vw,64px)/1.35 var(--display)}
  .mnav button{position:absolute;top:18px;inset-inline-end:var(--gut);background:none;border:0;color:inherit;font:700 var(--body) 'IBM Plex Sans Arabic',sans-serif;padding:8px 0;cursor:pointer}

  .btn{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 30px;border-radius:999px;font:700 var(--body) 'IBM Plex Sans Arabic',sans-serif;border:0;cursor:pointer;transition:transform .2s,background .2s,color .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .btn.y{background:var(--yellow);color:var(--ink)}
  .btn.y:hover{background:var(--white)}
  .btn.w{background:var(--white);color:var(--ink)}
  .btn.w:hover{background:var(--yellow)}
  .btn.k{background:var(--ink);color:var(--white)}
  .btn.k:hover{background:var(--yellow);color:var(--ink)}

  .pin{position:relative}
  .stage{position:sticky;top:0;height:100svh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* each scene closes as a loop opening onto the next scene's color */
  .iris{position:absolute;inset:0;z-index:6;visibility:hidden;pointer-events:none}
  .hide{visibility:hidden}

  /* 1. the brew: footage inside the loop, which opens to the whole screen */
  .brew{height:760vh}
  .brew .stage{background:var(--ink)}
  .scrim{position:absolute;inset:0;background:#000;opacity:0}
  .hero{position:absolute;inset-inline:var(--gut);top:calc(var(--nav) + 8vh);max-width:min(52vw,820px);z-index:2}
  .hero h1{font-size:clamp(38px,5.2vw,92px)}
  .hero h1 span{display:block;white-space:nowrap}
  .hero p{font-size:var(--lead);line-height:1.4;margin-top:clamp(20px,3vh,36px);max-width:min(26em,44vw)}
  html[dir=ltr] .hero h1{font-size:clamp(28px,3.9vw,72px)}
  .hero .acts{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-top:clamp(20px,3vh,36px)}
  .hero small{font-size:var(--body);color:var(--muted)}
  @media (max-width:859px){
    .hero{max-width:none;top:calc(var(--nav) + 3vh)}
    .hero h1{font-size:clamp(34px,10.4vw,72px)}
    html[dir=ltr] .hero h1{font-size:7.4vw}
    .hero p{font-size:var(--body);margin-top:12px;max-width:none}
    .hero .acts{margin-top:14px}
    .hero small{display:none}
  }
  .cap{position:absolute;inset-inline:var(--gut);bottom:calc(var(--bar) + clamp(24px,6vh,56px));font-size:var(--giant);line-height:1.1;z-index:2}
  .word{position:absolute;inset-inline:0;top:44%;text-align:center;font-size:min(30vw,46vh);line-height:1.1;transform:translateY(-58%);white-space:nowrap;z-index:2}
  html[dir=ltr] .word{font-size:min(22vw,46vh)}
  .herocup{--w:min(44vh,74vw);position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:1070/1000;margin-left:calc(var(--w)/-2);margin-top:calc(var(--w)*-.46);z-index:3;will-change:transform}
  .herocup img{object-fit:contain}
  .final{position:absolute;inset-inline:var(--gut);bottom:calc(var(--bar) + clamp(20px,5vh,48px));display:flex;flex-wrap:wrap;gap:10px;z-index:4}
  @media (max-width:859px){.word{top:26%}.herocup{--w:min(38vh,74vw);top:54%}}
  .shot{position:absolute;top:calc(var(--nav) + 3vh);inset-inline-start:var(--gut);font-size:var(--body);font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums;z-index:2}
  .shot b{display:block;font:800 var(--lead)/1.2 var(--display);margin-bottom:10px}

  /* 2. the roast */
  .roast{height:360vh}
  .roast .stage{background:#CDD5C0;color:var(--ink)}
  .rdisc{position:absolute;left:50%;top:54%;width:min(70vh,92vw);aspect-ratio:1;transform:translate(-50%,-50%);background:#fff;opacity:.2}
  .bean{position:absolute;left:50%;top:54%;width:min(62vh,82vw);aspect-ratio:1555/1192;transform:translate(-50%,-50%);z-index:2;will-change:transform}
  .bean img{position:absolute;inset:0;object-fit:contain}
  .crack{position:absolute;inset-inline:0;top:54%;text-align:center;font:800 min(22vw,38vh)/1 var(--display);transform:translateY(-50%);z-index:3;color:#fff;mix-blend-mode:overlay;pointer-events:none}
  .rhead{position:absolute;top:calc(var(--nav) + 3vh);inset-inline-end:var(--gut);font-size:var(--lead);line-height:1.2;max-width:12em;text-align:end;z-index:3}
  .temp{position:absolute;top:calc(var(--nav) + 2vh);inset-inline-start:var(--gut);font-size:var(--giant);line-height:1;font-variant-numeric:tabular-nums;z-index:3}
  .temp sup{font-size:.36em;vertical-align:.9em}
  .rl{position:absolute;inset-inline:var(--gut);bottom:calc(var(--bar) + clamp(20px,5vh,48px));height:90px;z-index:3}
  .rl div{position:absolute;bottom:0;inset-inline-end:0;text-align:end}
  .rl h3{font-size:var(--lead);line-height:1.25}
  .curve{position:absolute;inset:auto 0 calc(var(--bar) + 110px);height:38%;width:100%;pointer-events:none}
  @media (max-width:859px){.rhead{inset-inline:var(--gut);max-width:none;text-align:start}.temp{top:calc(var(--nav) + 3vh + 38px)}.rdisc,.bean,.crack{top:56%}}

  /* 3. the drinks, and the live thing: pick today's mood, get its drink */
  .drinks .stage{background:#fff;color:var(--ink)}
  .dhead{position:absolute;top:calc(var(--nav) + 2vh);inset-inline-start:var(--gut);font-size:var(--lead);line-height:1.25;z-index:4}
  .ddisc{position:absolute;left:50%;top:52%;width:min(66vh,88vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:0}
  .dword{position:absolute;inset-inline:0;top:52%;text-align:center;font:800 min(17vw,42vh)/1.1 var(--display);white-space:nowrap;transform:translateY(-55%);z-index:1;will-change:transform,opacity}
  html[dir=ltr] .dword{font-size:min(13vw,40vh)}
  .dcup{--h:min(70vh,100vw);position:absolute;left:50%;top:52%;height:calc(var(--h)*var(--s,1));transform:translate(-50%,-50%);z-index:2;will-change:transform}
  .dcup img{object-fit:contain}
  .dfoot{position:absolute;inset-inline:var(--gut);bottom:calc(var(--bar) + clamp(14px,3.5vh,32px));z-index:4;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
  .dinfo{position:relative;height:30px;flex:1 1 300px;min-width:240px}
  .dinfo p{position:absolute;inset-inline:0;bottom:0;font-weight:700;white-space:nowrap}
  .dbtns{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .dbtns::-webkit-scrollbar{display:none}
  .dbtns button{flex:none;height:46px;padding:0 20px;border-radius:999px;background:none;border:2px solid currentColor;color:inherit;font:700 var(--body) 'IBM Plex Sans Arabic',sans-serif;cursor:pointer;transition:transform .2s}
  .dbtns button:active{transform:scale(.96)}
  .dbtns button[aria-pressed="true"]{background:currentColor}
  .dbtns button[aria-pressed="true"] span{color:var(--pressed,#fff)}
  /* phones: the cup is as wide as the word, so the word stands higher and the cup overlaps only its lower edge */
  @media (max-width:859px){.dword{top:35%}.ddisc{top:58%;width:80vw}.dcup{--h:min(44vh,88vw);top:58%}}

  /* 4. together */
  .say{background:var(--yellow);color:var(--ink);padding:clamp(72px,10vw,160px) var(--gut);display:grid;gap:40px;align-items:center}
  .say h2{font-size:var(--head)}
  .say .big{font:500 clamp(22px,2.4vw,36px)/1.4 var(--display);max-width:24em;margin-top:clamp(20px,3vw,40px)}
  .say .small{font-weight:700;margin-top:clamp(24px,3vw,40px)}
  .say figure{aspect-ratio:1;width:min(100%,640px);justify-self:center;background:#d9a916}
  @media (min-width:860px){.say{grid-template-columns:7fr 5fr;gap:64px}}

  /* 5. menu */
  .menu{background:var(--ink);padding:clamp(72px,10vw,160px) var(--gut)}
  .mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:clamp(40px,6vw,96px)}
  .menu h2{font-size:var(--giant);line-height:1}
  .note{color:var(--muted)}
  .cols{display:grid;gap:clamp(56px,7vw,112px) clamp(32px,6vw,96px)}
  @media (min-width:860px){.cols{grid-template-columns:1fr 1fr}}
  .cat header{display:flex;align-items:center;gap:20px;margin-bottom:clamp(16px,2vw,28px)}
  .cat header figure{width:clamp(84px,9vw,136px);aspect-ratio:1;flex:none;background:#2a2622}
  .cat h3{font-size:var(--lead);color:var(--yellow);line-height:1.2}
  .cat header figure.fit img{object-fit:contain;padding:6px}
  .it{padding:clamp(12px,1.2vw,18px) 0}
  .it div{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .it b{font:700 clamp(21px,1.9vw,28px)/1.25 var(--display)}
  .it i{flex:none;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;color:var(--yellow)}
  .it p{color:var(--muted);line-height:1.45;margin-top:3px;max-width:44em}
  .it small{display:block;font-size:var(--small);color:var(--muted);margin-top:2px}
  .order{margin-top:16px}

  /* invite: the clip grows from a loop to the whole screen */
  .pour{height:300vh;background:var(--ink)}
  .pour .stage{background:var(--ink)}
  .vid{position:absolute;inset:0;will-change:clip-path}
  .inv{position:absolute;inset-inline:var(--gut);bottom:calc(var(--bar) + clamp(24px,6vh,56px));display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;z-index:2}
  .inv h2{max-width:14em}

  /* 6. the mood */
  .place{height:320vh;background:var(--ink)}
  .place .stage{background:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,28px);padding-top:var(--nav)}
  .place h2{padding-inline:var(--gut)}
  .track{display:flex;gap:clamp(12px,1.6vw,24px);padding-inline:var(--gut);height:min(62vh,680px);width:max-content;will-change:transform}
  .track figure{height:100%;aspect-ratio:9/14;flex:none;background:#2a2622}

  /* 7. visit */
  .visit{background:var(--white);color:var(--ink);padding:clamp(72px,10vw,160px) var(--gut);display:grid;gap:40px;align-items:center}
  .addr{font-size:var(--lead);line-height:1.3;margin-top:clamp(20px,2.4vw,36px);max-width:20em}
  .facts{margin-top:16px}
  .facts a{font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--yellow);text-decoration-thickness:3px}
  .days{width:100%;max-width:360px;border-collapse:collapse;margin-top:8px}
  .days td{padding:2px 0}
  .days td:last-child{text-align:end}
  .days .today{font-weight:700}
  .visit .btn{margin-top:28px}
  .vphoto{aspect-ratio:1;width:min(100%,640px);justify-self:center;background:#ddd}
  .vphoto img{object-position:50% 88%}
  @media (min-width:860px){.visit{grid-template-columns:6fr 6fr;gap:64px}}

  footer{background:var(--ink);padding:clamp(48px,6vw,96px) var(--gut) 28px;font-size:var(--small);overflow:hidden}
  footer .huge{font:800 min(29vw,380px)/1 var(--display);text-align:center}
  footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 28px;margin-top:28px;font-size:var(--body)}
  footer ul{display:flex;gap:20px;font-weight:700}
  footer .by a{text-decoration:underline}
  footer .credit{margin-top:14px;color:var(--muted)}

  .bar{position:fixed;inset:auto 0 0;z-index:25;display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom);background:var(--ink)}
  .bar a{height:56px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
  .bar a:first-child{background:var(--yellow);color:var(--ink)}
  @media (min-width:860px){.bar{display:none}}

  /* section parts rise in once; with reduced motion nothing is ever hidden */
  @media (prefers-reduced-motion:no-preference){
    .js .rise{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*80ms)}
    .js .rise.in{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .btn,.dbtns button{transition:none}
  }
</style>
</head>

  function req() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
  addEventListener("scroll", req, { passive: true });
  addEventListener("resize", function () { seq1.dirty = true; fitWords(); req(); });
  fitWords();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitWords);

  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      var r = $("drinks").getBoundingClientRect(), top = scrollY + r.top + DRINKS_END * (+b.dataset.i / (dr.length - 1)) * (r.height - innerHeight);
      scrollTo({ top: top, behavior: reduce ? "auto" : "smooth" });
    });
  });

  /* language switch keeps the visitor's place on the page */
  q(".langb").forEach(function (b) {
    b.addEventListener("click", function () {
      store("loopie-lang", t.otherLang);
      location.href = location.pathname + "?lang=" + t.otherLang + location.hash;
    });
  });

  /* phone menu */
  var mnav = $("mnav"), mopen = $("mopen"), mclose = $("mclose");
  function setMenu(on) {
    mnav.hidden = !on;
    mopen.setAttribute("aria-expanded", on ? "true" : "false");
    document.documentElement.style.overflow = on ? "hidden" : "";
    (on ? mclose : mopen).focus();
  }
  mopen.addEventListener("click", function () { setMenu(true); });
  mclose.addEventListener("click", function () { setMenu(false); });
  q("a", mnav).forEach(function (a) { a.addEventListener("click", function () { setMenu(false); }); });
  addEventListener("keydown", function (e) { if (e.key === "Escape" && !mnav.hidden) setMenu(false); });

  brew(0); roast(0); drinks(0); pour(0); frame();
})();
</script>
